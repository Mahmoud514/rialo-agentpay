name: docker-build

# Builds the server Docker image on every push to main and manual trigger.
# Read-only: the image is built and locally cached by the runner — NO
# registry push in this phase (G21.6 scope). GHCR publishing is a later,
# separately-approved step. Free tier: ubuntu-latest runner, $0.

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "wit/**"
      - "frontend/src/**"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/docker-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-image:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # Nightly toolchain matches the builder stage (rust:1.91 + nightly).
      # Not strictly required for `docker build` (the container installs its
      # own toolchain), but compiling once on the host keeps Cargo.lock
      # honesty verified before the heavier container build.
      - uses: dtolnay/rust-toolchain@nightly

      - name: Verify lockfile integrity (host, cheap, before docker)
        run: cargo +nightly fetch --locked

      # ── G21: provide the pinned Rialo CLI 0.18.1 (RIALO_CLI_UNAVAILABLE fix) ──
      # Supply chain: the vendor tarball is NOT in git (127MB, gitignored).
      # It must come from a GitHub Release asset on this repository that the
      # OPERATOR uploaded once. Trust model (honest scope):
      #   * the asset URL is pinned in this file (operator-controlled asset)
      #   * integrity = the SHA256 gate below + the Dockerfile's own
      #     `sha256sum -c` (build hard-fails on any mismatch)
      #   * *no independent upstream signature exists for the vendor bundle
      #     today* — documented in vendor/RIALO_CLI_PROVENANCE.md; do not
      #     claim a stronger verification than the pinned-hash match.
      # Local/air-gapped note: `gh release upload` needs the exact digest
      #   652c94e14d0744f617988199515bbad1977fe40390b0a998928c1e2bb7e6af69
      - name: Fetch pinned Rialo CLI 0.18.1 bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p vendor
          gh release download rialo-cli-0.18.1 \
            --repo "${GITHUB_REPOSITORY}" \
            --pattern "binaries-stable-0.18.1-linux-amd64.tar.gz" \
            --output vendor/binaries-stable-0.18.1-linux-amd64.tar.gz
          echo "652c94e14d0744f617988199515bbad1977fe40390b0a998928c1e2bb7e6af69  vendor/binaries-stable-0.18.1-linux-amd64.tar.gz" \
            | sha256sum -c -

      # Required for the GHA cache backend: the default `docker` driver
      # cannot export caches (Cache export is not supported for the docker
      # driver — run 38506909590). Buildx sets up a docker-container driver.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false # G21.6: no publishing yet
          tags: rialo-agentpay:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
